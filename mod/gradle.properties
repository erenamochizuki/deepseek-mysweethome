# NOTE: Gradle reads this file as ISO-8859-1. Write any non-ASCII text as \uXXXX escapes
# (comments included, to keep the file pure ASCII).
# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

## Environment
# The user's game runs NeoForge 26.1.2.76, so we compile against exactly that version.
minecraft_version=26.1.2
minecraft_version_range=[26.1.2]
neo_version=26.1.2.76

## Main mod (goes into the release jar)
mod_id=xiaojingyu
# Chinese name "Xiao Jing Yu Zhi Jia" (Little Whale's Home)
mod_name=\u5C0F\u9CB8\u9C7C\u4E4B\u5BB6
# Chinese: "Little Whale's Home: the Minecraft mod of the Seaside Cottage."
mod_description=\u5C0F\u9CB8\u9C7C\u4E4B\u5BB6\uFF1A\u6D77\u8FB9\u5C0F\u5C4B\u7684\u6211\u7684\u4E16\u754C\u6A21\u7EC4\u3002
# License decided by the user on 2026-11-06: CC BY-NC-SA 4.0 (SPDX id), author Moci. See ../LICENSE.md.
mod_license=CC-BY-NC-SA-4.0
mod_authors=Moci
mod_version=0.1.0
mod_group_id=com.xiaojingyu

## Dev-only probe mod (src/probe, loaded only by runClient, never packaged)
probe_mod_id=xjyprobe
# Chinese: "Little Whale's Home dev probe"
probe_mod_name=\u5C0F\u9CB8\u9C7C\u4E4B\u5BB6 \u5F00\u53D1\u63A2\u9488
