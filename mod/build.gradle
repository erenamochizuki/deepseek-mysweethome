plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// ---------------------------------------------------------------------------
// Source sets
//   main  -> the real mod "xiaojingyu" (the only thing that goes into the jar)
//   probe -> dev-only mod "xjyprobe" (HTTP probe for automated tests).
//            It is a separate source set, so the `jar` task never sees it.
// ---------------------------------------------------------------------------
sourceSets {
    main.resources {
        // Include resources generated by data generators.
        srcDir('src/generated/resources')
        // Exclude common development only resources from finalized outputs
        exclude('**/*.bbmodel')
        exclude('src/generated/**/.cache')
    }
    probe
}

repositories {
    // MDG adds the NeoForged / Mojang / Maven Central repositories by itself.
}

configurations {
    // 'localRuntime': runtime-only deps for dev runs that are not published.
    runtimeClasspath.extendsFrom localRuntime
    // The probe sees everything main sees.
    probeImplementation.extendsFrom implementation
    probeRuntimeClasspath.extendsFrom localRuntime
}

dependencies {
    // The probe may call into the main mod (needed later for capture/place tests).
    probeImplementation sourceSets.main.output
}

neoForge {
    version = project.neo_version

    // Minecraft + NeoForge classes for the isolated probe source set.
    addModdingDependenciesTo sourceSets.probe

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        "${probe_mod_id}" {
            sourceSet(sourceSets.probe)
        }
    }

    runs {
        // Dev client: main mod + probe. Uses the probe source set's runtime
        // classpath (= probe output + main output + Minecraft/NeoForge).
        client {
            client()
            sourceSet = sourceSets.probe
            loadedMods = [neoForge.mods.getByName(project.mod_id), neoForge.mods.getByName(project.probe_mod_id)]
            // Fixed window size so screenshots are comparable.
            programArguments.addAll('--width', '1280', '--height', '720')
            // Probe HTTP port: random by default, or `gradlew runClient -Pxjyprobe.port=PORT`.
            systemProperties.put('xjyprobe.port', providers.gradleProperty('xjyprobe.port').orElse('0'))
            // Probe input lock (POST /input): `gradlew runClient -Pxjyprobe.lockInput=true` starts with keyboard and mouse ignored.
            systemProperties.put('xjyprobe.lockInput', providers.gradleProperty('xjyprobe.lockInput').orElse('false'))
            // The probe uses the JDK's built-in HTTP server; make sure its module is in the boot layer.
            jvmArguments.add('--add-modules=jdk.httpserver')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // The runs below load only the main mod (no probe).
        server {
            server()
            loadedMods = [neoForge.mods.getByName(project.mod_id)]
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = 'gameTestServer'
            loadedMods = [neoForge.mods.getByName(project.mod_id)]
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            loadedMods = [neoForge.mods.getByName(project.mod_id)]
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

// ---------------------------------------------------------------------------
// neoforge.mods.toml generation (main + probe)
// ---------------------------------------------------------------------------
var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_description        : mod_description,
            mod_license            : mod_license,
            mod_authors            : mod_authors,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

var generateProbeMetadata = tasks.register('generateProbeMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            probe_mod_id           : probe_mod_id,
            probe_mod_name         : probe_mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/probe/templates'
    into 'build/generated/sources/probeMetadata'
}
sourceSets.probe.resources.srcDir generateProbeMetadata
neoForge.ideSyncTask generateProbeMetadata

// `gradlew build` also compiles the probe (so it cannot rot), but the probe is
// never added to the jar: `jar` only packages sourceSets.main.
tasks.named('check') {
    dependsOn tasks.named('probeClasses')
}

// ---------------------------------------------------------------------------
// Dev presets: before the first client start, copy
//   dev/options.txt           -> run/options.txt
//   dev/neoforge-client.toml  -> run/config/neoforge-client.toml
// Each target is written only if it does not exist yet (later edits are kept;
// delete the target file to re-seed it).
// ---------------------------------------------------------------------------
var seedDevOptions = tasks.register('seedDevOptions') {
    description = 'Copies dev/options.txt and dev/neoforge-client.toml into run/ if the targets do not exist yet.'
    var pairs = [
            [layout.projectDirectory.file('dev/options.txt'), layout.projectDirectory.file('run/options.txt')],
            [layout.projectDirectory.file('dev/neoforge-client.toml'), layout.projectDirectory.file('run/config/neoforge-client.toml')],
    ]
    pairs.each { pair -> inputs.file(pair[0]) }
    outputs.upToDateWhen { false }
    doLast { task ->
        pairs.each { pair ->
            var s = pair[0].asFile
            var d = pair[1].asFile
            if (!d.exists()) {
                d.parentFile.mkdirs()
                d.bytes = s.bytes
                task.logger.lifecycle("seedDevOptions: wrote ${d}")
            } else {
                task.logger.lifecycle("seedDevOptions: kept existing ${d}")
            }
        }
    }
}
tasks.named { it == 'runClient' }.configureEach {
    dependsOn seedDevOptions
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------------------
// shareTest: checks for the share format (docs/FORMAT.md), run in a plain JVM
// with Minecraft's own NBT classes (the game is not started). Not a mod and
// never in the jar.
//   gradlew shareTest [-Prequire-cross]  all checks (`check`, so `build`, runs it)
//   gradlew shareFixtures                rewrite ../fixtures/share/java/*.png
//   gradlew shareDump -Pfile=PATH        print the dump JSON of one file
//                                        (a relative PATH starts at mod/)
// ---------------------------------------------------------------------------
sourceSets {
    shareTest
}

configurations {
    shareTestImplementation.extendsFrom implementation
}

dependencies {
    shareTestImplementation sourceSets.main.output
}

neoForge {
    addModdingDependenciesTo sourceSets.shareTest
}

// -Pfixtures=DIR points the tasks at another fixture tree (relative to mod/).
var shareFixturesDir = file(providers.gradleProperty('fixtures').getOrElse('../fixtures/share')).absolutePath
// -Pformat-doc=FILE: the copy of FORMAT.md whose §4 example and §5 tables are checked (relative to mod/).
var shareFormatDoc = file(providers.gradleProperty('format-doc').getOrElse('../docs/FORMAT.md')).absolutePath
// Working directory for these JVMs (log4j writes logs/ there, not into mod/).
var shareRunDir = layout.buildDirectory.dir('shareTest-run').get().asFile
// -Pshare-heap=SIZE: heap of these JVMs (default 1g), e.g. 256m to check the tag limit keeps memory small.
var shareHeap = providers.gradleProperty('share-heap').getOrElse('1g')

tasks.register('shareTest', JavaExec) {
    description = 'Checks the share format (docs/FORMAT.md) in a plain JVM. -Prequire-cross: missing cross-read files fail.'
    group = 'verification'
    classpath = sourceSets.shareTest.runtimeClasspath
    mainClass = 'com.xiaojingyu.share.ShareTestMain'
    workingDir = shareRunDir
    maxHeapSize = shareHeap
    jvmArgs '-Djava.awt.headless=true'
    args 'test', '--fixtures', shareFixturesDir, '--format-doc', shareFormatDoc
    if (providers.gradleProperty('require-cross').present) {
        args '--require-cross'
    }
    doFirst { shareRunDir.mkdirs() }
}

tasks.register('shareFixtures', JavaExec) {
    description = 'Rewrites ../fixtures/share/java/*.png from ../fixtures/share/cases/*.json.'
    group = 'share'
    classpath = sourceSets.shareTest.runtimeClasspath
    mainClass = 'com.xiaojingyu.share.ShareTestMain'
    workingDir = shareRunDir
    maxHeapSize = shareHeap
    args 'fixtures', '--fixtures', shareFixturesDir
    doFirst { shareRunDir.mkdirs() }
}

tasks.register('shareDump', JavaExec) {
    description = 'Prints the dump JSON of one file: -Pfile=PATH [-Pout=PATH] (relative to mod/).'
    group = 'share'
    classpath = sourceSets.shareTest.runtimeClasspath
    mainClass = 'com.xiaojingyu.share.ShareTestMain'
    workingDir = shareRunDir
    maxHeapSize = shareHeap
    args 'dump', '--file', providers.gradleProperty('file').map { file(it).absolutePath }.getOrElse('')
    var dumpOut = providers.gradleProperty('out').map { file(it).absolutePath }
    if (dumpOut.present) {
        args '--out', dumpOut.get()
    }
    doFirst { shareRunDir.mkdirs() }
}

// `gradlew build` runs the share checks too.
tasks.named('check') {
    dependsOn tasks.named('shareTest')
}

// ---------------------------------------------------------------------------
// cmdTest: small checks for the /xjy commands (docs/COMMANDS.md) that need no
// running game: coordinates and turning, file names, the preview picture, the
// translation files. Plain JVM with Minecraft's classes on the class path; not
// a mod and never in the jar.
//   gradlew cmdTest                      only these checks (`check`, so `build`, runs them too)
// ---------------------------------------------------------------------------
sourceSets {
    cmdTest
}

configurations {
    cmdTestImplementation.extendsFrom implementation
}

dependencies {
    cmdTestImplementation sourceSets.main.output
}

neoForge {
    addModdingDependenciesTo sourceSets.cmdTest
}

// Working directory of the test JVM (log4j would write logs/ there), kept under build/.
var cmdRunDir = layout.buildDirectory.dir('cmdTest-run').get().asFile
var cmdLangDir = file('src/main/resources/assets/xiaojingyu/lang').absolutePath
var cmdSrcDir = file('src/main/java/com/xiaojingyu').absolutePath
var cmdFormatDoc = file('../docs/FORMAT.md').absolutePath
// The compiled main classes: ClientSplit checks that only com/xiaojingyu/client/ names client-only classes.
var cmdMainClasses = sourceSets.main.java.destinationDirectory.get().asFile.absolutePath

tasks.register('cmdTest', JavaExec) {
    description = 'Checks the /xjy command helpers (docs/COMMANDS.md) in a plain JVM: turning, file names, preview, translations, capture filter, blacklist file, client/server split.'
    group = 'verification'
    classpath = sourceSets.cmdTest.runtimeClasspath
    mainClass = 'com.xiaojingyu.build.CmdTestMain'
    workingDir = cmdRunDir
    jvmArgs '-Djava.awt.headless=true'
    args '--lang', cmdLangDir, '--src', cmdSrcDir, '--format-doc', cmdFormatDoc, '--classes', cmdMainClasses
    doFirst { cmdRunDir.mkdirs() }
}

tasks.named('check') {
    dependsOn tasks.named('cmdTest')
}
