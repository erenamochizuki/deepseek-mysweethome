# P5-003：第 3 轮的屋外 15 种家具方块（docs/FURNITURE.md 8.1、9.1、9.3）在开发 MC 里核对。
# 这个文件是 fixtures/furniture-p5/make3.mjs 生成的，不要手改：改了生成器重新跑（--check 会查）。
# 状态：xiaojingyu:<id>[facing]（单格）或 [facing,part=0..N−1]；part = cx + w×(cz + d×cy)，主格 part 0；
# 朝向转法 east (cx,cz)→(−cz,cx)、south →(−cx,−cz)、west →(cz,−cx)，相对主格。
# 测试鲸图 fixtures/furniture-p5/furniture-p5-3.png：15×3×34，Offset (-7,0,-35)，Facing north，每种一排、每排 4 个朝向。
#  A：setblock … strict 一格一格照鲸图放，格子 (0,0,0) = (1,-60,5)，盒子 x 1..15、z 5..38；
#     然后 expect_file（和 dump 一模一样）、expect_shapes（游戏不会改）。
#  B：站 (40,-60,0) 朝北 xjy place（auto 不转），格子 (0,0,0) = (33,-60,-35)；expect_file、expect_shapes。
#  R：站 (100,-60,0) 朝北 xjy place … 90（顺时针 90°：(x,z)→(−z,x)），盒子 x 102..135、z -7..7；expect_shapes。
#  站高（创造模式，人会往下掉）：tp 到格子上方半格，等 2 秒，data get entity @s Pos[1] 16 的 result：
#     thin 站在 1/16 格高的地方 = (−60 + 1/16)×16 = −959；none 掉穿过去站在草地上 = −960。
#     遮阳伞伸出去的伞面没有碰撞：tp 到伞顶那格东边一格、伞面的高度，也掉到草地上（−960）。
#  拆：B 里每种挑朝东那件，setblock 它最后一格（单格就是它自己）… air destroy（像玩家挖），整件都变空气，
#     附近正好 1 个掉落物，就是这种家具。每次之前清掉掉落物。
#  风铃（9.3）：站 (150,-60,4) 朝北 xjy place 风铃的小鲸图，风铃在 (150,-57,2)，下面 3 格 y -60..-58 是「风铃下面」。
#     开发版里每响一串 wind_chime.rings 加 1、每响一下 wind_chime.hits 加 1（command storage xiaojingyu:dev）。
#     猪（NoAI）tp 进来响 1 串（2–3 下）；站着不动不再响；两只猪一起进来只响 1 串；创造模式的玩家进来也响；旁观模式不响。
#  截图：每种朝南放一件在 z=70 那排，旁观模式、不带界面，从东南边看（正面和东面）；再拍一张 A 的全景。
title: 第 3 轮屋外 15 种家具：setblock / xjy place 各 4 个朝向、/shapes、站高、伸出格子、拆、风铃会响、截图
