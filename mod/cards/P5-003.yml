  # ---- 风铃会响（9.3）：/xjy place 盖出来的风铃，猪和玩家走进下面那一列 ----
  - copy_file: {from: fixtures/furniture-p5/furniture-p5-3-chime.png, to: 'P5-003-chime-${run}.png'}
  - cmd: tp @s 150.5 -60 4.5 180 0
  - cmd: {command: 'xjy place P5-003-chime-${run}', result: 4}
  - cmd: {command: xjy status, until: 0}
  - expect_block: {pos: [150, -57, 2], state: 'xiaojingyu:wind_chime[facing=south]'}
  - expect_block: {pos: [150, -58, 2], state: 'minecraft:air'}
  - cmd: 'data merge storage xiaojingyu:dev {wind_chime:{rings:0,hits:0}}'
  - cmd: {command: "scoreboard objectives add xjy_p5 dummy", success: any}
  - cmd: 'summon minecraft:pig 153.5 -60 2.5 {NoAI:1b,Tags:["xjy_pig","xjy_a"]}'
  - cmd: 'summon minecraft:pig 153.5 -60 0.5 {NoAI:1b,Tags:["xjy_pig","xjy_b"]}'
  - sleep: 1
  # 还没有东西进来：不响
  - cmd: {command: 'data get storage xiaojingyu:dev wind_chime.rings', result: 0}
  # 一只猪进来：响 1 串，2–3 下
  - cmd: tp @e[tag=xjy_a] 150.5 -60 2.5
  - cmd: {command: 'data get storage xiaojingyu:dev wind_chime.rings', until: {result: 1, timeout: 5, interval: 0.1}}
  - sleep: 1.5
  - cmd: 'execute store result score hits xjy_p5 run data get storage xiaojingyu:dev wind_chime.hits'
  - cmd: {command: 'execute if score hits xjy_p5 matches 2..3', result: 1}
  - cmd: {command: 'data get storage xiaojingyu:dev wind_chime.last[1]', result: -57}
  # 站着不动：不再响
  - sleep: 2
  - cmd: {command: 'data get storage xiaojingyu:dev wind_chime.rings', result: 1}
  # 出去，再和另一只猪一起进来：只响 1 串（同一个风铃 1 秒内不重复响）
  - cmd: tp @e[tag=xjy_a] 153.5 -60 2.5
  - sleep: 0.5
  - cmd: {command: 'data get storage xiaojingyu:dev wind_chime.rings', result: 1}
  - cmd: tp @e[tag=xjy_pig] 150.5 -60 2.5
  - cmd: {command: 'data get storage xiaojingyu:dev wind_chime.rings', until: {result: 2, timeout: 5, interval: 0.1}}
  - sleep: 1.5
  - cmd: {command: 'data get storage xiaojingyu:dev wind_chime.rings', result: 2}
  # 猪都出去；创造模式的玩家进来：响
  - cmd: tp @e[tag=xjy_pig] 153.5 -60 2.5
  - sleep: 1.5
  - cmd: tp @s 150.5 -60 2.5 180 0
  - cmd: {command: 'data get storage xiaojingyu:dev wind_chime.rings', until: {result: 3, timeout: 5, interval: 0.1}}
  # 旁观模式进来：不响
  - cmd: tp @s 150.5 -60 4.5 180 0
  - cmd: gamemode spectator
  - sleep: 1.5
  - cmd: tp @s 150.5 -60 2.5 180 0
  - sleep: 1.5
  - cmd: {command: 'data get storage xiaojingyu:dev wind_chime.rings', result: 3}
  - cmd: gamemode creative
  - cmd: tp @s 150.5 -60 4.5 180 0
  - cmd: {command: "kill @e[tag=xjy_pig]", success: any}

