# P5-004：相册和相框（docs/PHOTOS.md 第 4 节，mod7 2026-11-08）。这张卡片是 node mod/tools/photo-card.mjs 生成的，别手改。
# 相册矮桌（xiaojingyu:photo_album_table）带 3 张照片（中间夹一张坏的，翻页时跳过）；新相框和画框墙各 4 个朝向，挂在一个
# 白色方块（x 10..14，y -60..-57，z 10..14）的四面上；相册矮桌放在方块顶上 (12,-56,12)，离每个框都不到 16 格。
# 照片：底色 + 左上白块、右上黄块、左下黑块 + 中间几根白竖条（A 红 1 根、B 绿 2 根、C 蓝 3 根；D 紫 4 根不在相册里）。
# 1. 用探针 /use 模拟右键（不发真实键鼠）：下一张、潜行上一张、最后一张后面是空、找不到换第一张 / 潜行换最后一张；
#    画框墙按点到的位置找是哪个框（4 个朝向，6 个框都点）；手里拿方块时右键是放方块，不换照片；潜行又拿着东西时不换；
#    拿着新相框的物品点墙的侧面 → 贴在那面墙上（用物品放，(15,-58,11) 朝东），点地面 → 朝着人。
#    远处：16 格里没有相册矮桌（40,-59,10）、相册是空的（60,-59,10，旁边 (60,-60,12) 是空的相册矮桌）、坏照片 (42,-59,10)。
# 2. 旁观模式拍 4 面（看照片贴的位置、朝向：从正面看白块在左上、黄块在右上、黑块在左下）。
# 3. 区块包的照片预算（开发游戏才有的 xiaojingyu:dev photo_chunk_budget）调成 2000 字节，走远再回来，区块重发时
#    超出预算的方块实体单独发（photo_late_sent 有数），再拍 2 张照片还在。
# 4. 站 (12,-60,3) 朝南 xjy capture range 12 0 3 6 → 清成空气 → 原地 xjy place → 马上拍照（客户端马上看得到）→
#    capture 上次 和第一次抓的逐格一样（方块实体的数据也比：照片、坏照片原样）。
title: 相册和相框：右键换照片（4 个朝向）、画出来、区块包预算、capture / place 带着照片
steps:
  - open: P5-004
  - wait: {inWorld: true, screen: null, timeout: 180}
  - cmd: gamerule send_command_feedback false
  - cmd: gamerule random_tick_speed 0
  - cmd: gamerule advance_time false
  - cmd: gamerule advance_weather false
  - cmd: gamerule spawn_mobs false
  - cmd: time set noon
  - cmd: weather clear
  - cmd: {command: "kill @e[type=!minecraft:player]", success: any}
  - cmd: gamemode creative
  - cmd: tp @s 12.5 -60 3.5 0 0

