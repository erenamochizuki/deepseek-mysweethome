  # 区块包预算调成 2000 字节（开发游戏才认），走远（区块卸掉）再回来：区块重发时超出预算的单独发
  - cmd: 'data modify storage xiaojingyu:dev photo_chunk_budget set value 2000'
  - cmd: {command: 'data remove storage xiaojingyu:dev photo_late_sent', success: any}
  - cmd: tp @s 3000.5 -50 3000.5 0 0
  - sleep: 2
  - wait: {chunksRendered: true, stableFor: 2, timeout: 60}
  - sleep: 3
  - cmd: tp @s 12.00 -60.12 5.00 0 0
  - sleep: 1
  - wait: {chunksRendered: true, stableFor: 2, timeout: 60}
  - sleep: 5
  - shot: {name: P5-004-late-north, meanBrightness: [0.05, 0.95], distinctColors: 50, hideGui: true}
  - cmd: tp @s 12.00 -60.12 19.00 180 0
  - sleep: 1
  - wait: {chunksRendered: true, stableFor: 2, timeout: 60}
  - sleep: 3
  - shot: {name: P5-004-late-south, meanBrightness: [0.05, 0.95], distinctColors: 50, hideGui: true}
  - cmd: {command: 'execute if data storage xiaojingyu:dev photo_late_sent', result: 1}
  - cmd: 'data remove storage xiaojingyu:dev photo_chunk_budget'

  # capture → 清成空气 → 原地 place → 马上拍 → capture 上次 和第一次的逐格一样（方块实体的数据也比）
  - cmd: 'gamemode creative'
  - cmd: 'tp @s 12.5 -60 3.5 0 0'
  - cmd: 'xjy capture range 12 0 3 6 P5-004-A-${run}'
  - cmd: 'fill 9 -61 4 15 -56 15 minecraft:air'
  - cmd: {command: 'kill @e[type=minecraft:item]', success: any}
  - cmd: {command: 'data get block 10 -59 9 Photo', success: false}
  - cmd: 'tp @s 12.5 -60 3.5 0 0'
  - cmd: {command: 'xjy place P5-004-A-${run}', result: 504}
  - cmd: {command: xjy status, until: 0}
  - cmd: {command: 'data get block 10 -59 9 Photo.Id', outputContains: '43de31e420e6cb5d'}
  - cmd: {command: 'data get block 12 -59 9 Slots[2].Id', outputContains: 'ecd36fd3cf1299f3'}
  - cmd: {command: 'data get block 42 -59 10 Photo.Png', result: 3}
  - cmd: 'gamemode spectator'
  - cmd: tp @s 12.00 -60.12 5.00 0 0
  - sleep: 1
  - wait: {chunksRendered: true, stableFor: 2, timeout: 60}
  - sleep: 3
  - shot: {name: P5-004-placed-north, meanBrightness: [0.05, 0.95], distinctColors: 50, hideGui: true}
  - cmd: tp @s 5.00 -60.12 12.00 -90 0
  - sleep: 1
  - wait: {chunksRendered: true, stableFor: 2, timeout: 60}
  - sleep: 3
  - shot: {name: P5-004-placed-west, meanBrightness: [0.05, 0.95], distinctColors: 50, hideGui: true}
  - cmd: 'gamemode creative'
  - cmd: 'xjy capture 上次 P5-004-B-${run}'
  - expect_files: {saved: 'P5-004-A-${run}', capture: 'P5-004-B-${run}'}

  - leave
  - wait: {inWorld: false, screen: TitleScreen, timeout: 60}
