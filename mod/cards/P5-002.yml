# P5-002：第 2 轮的 22 种家具方块（docs/FURNITURE.md 8.1、8.2）在开发 MC 里核对。
# 这个文件是 fixtures/furniture-p5/make2.mjs 生成的，不要手改：改了生成器重新跑（--check 会查）。
# 状态：xiaojingyu:<id>[facing]（单格）或 [facing,part=0..N−1]；part = cx + w×(cz + d×cy)，主格 part 0；
# 朝向转法 east (cx,cz)→(−cz,cx)、south →(−cx,−cz)、west →(cz,−cx)，相对主格。
# 测试鲸图 fixtures/furniture-p5/furniture-p5-2.png：19×2×54，Offset (-9,0,-55)，Facing north，每种一排、每排 4 个朝向。
#  A：setblock … strict 一格一格照鲸图放，格子 (0,0,0) = (1,-60,5)，盒子 x 1..19、z 5..58；
#     然后 expect_file（和 dump 一模一样）、expect_shapes（游戏不会改）。
#  B：站 (40,-60,0) 朝北 xjy place（auto 不转），格子 (0,0,0) = (31,-60,-55)；expect_file、expect_shapes。
#  R：站 (100,-60,0) 朝北 xjy place … 90（顺时针 90°：(x,z)→(−z,x)），盒子 x 102..155、z -9..9；expect_shapes。
#  站高（创造模式，人会往下掉）：tp 到格子上方半格，等 2 秒，data get entity @s Pos[1] 16 的 result：
#     thin 站在 1/16 格高的地方 = (−60 + 1/16)×16 = −959；none 掉穿过去站在草地上 = −960。
#  拆：B 里每种挑朝东那件，setblock 它最后一格（单格就是它自己）… air destroy（像玩家挖），整件都变空气，
#     附近正好 1 个掉落物，就是这种家具。每次之前清掉掉落物。
#  截图：每种朝南放一件在 z=70 那排（隔 4 格），旁观模式、不带界面，从东南边看（正面和东面）。
