<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>海边小屋 · 超稀有海滩收藏</title>
<style>
*{box-sizing:border-box}body{margin:0;color:#253f42;background:#f5f6ef;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1540px;margin:auto;padding:42px 4% 32px}header,footer,.catalog{display:flex;justify-content:space-between;align-items:end}small,footer,.number{font:12px ui-monospace,monospace;color:#526969}h1,h2{font-family:Georgia,"Songti SC",SimSun,serif}h1{font-size:40px;margin:9px 0 0}header{border-bottom:2px solid #355350;padding-bottom:20px}.stamp{text-align:right;line-height:1.6;color:#536762}.catalog{margin:18px 0 12px;color:#566961;font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}article{min-width:0}.stage{position:relative;background:var(--t);overflow:hidden}canvas{width:100%;height:auto;aspect-ratio: .88;display:block;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}.number{position:absolute;top:12px;left:13px;pointer-events:none}h2{font-size:25px;margin:0 0 5px}section{padding:16px 12px 22px;border-bottom:1px solid #90a19a}p{margin:0;font-size:14px;color:#546764}footer{padding-top:16px}@media(max-width:780px){main{padding:22px 4%}h1{font-size:29px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:16px}h2{font-size:21px}canvas{aspect-ratio:.97}.stamp{font-size:12px}section{padding:10px 4px 14px}}
article{display:flex;flex-direction:column}section{flex:1}section p{line-height:1.7}section small{display:block;margin:2px 0 9px;color:#61746b}@media(min-width:781px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
</style>
<main><header><div><small>海边小屋　/　海滩收藏</small><h1>月下拾遗</h1></div><div class="stamp">超稀有<br><small>潮间手记 · 01</small></div></header><div class="catalog"><span>海岸藏品图录</span><span>Ⅰ – Ⅴ</span></div><div class="grid" id="grid"></div><footer><span>海边小屋 · 海滩收藏</span><span id="rate"></span></footer></main>
<script src="../../../web/vendor/three.min.js"></script><script>window.V3={};</script><script src="../../../web/src/31-moon-treasures.js"></script><script src="../../../web/src/31-washup-catalog.js"></script><script src="../../../web/src/59-cabin-tide.js"></script><script src="../../../web/src/58-inventory-rules.js"></script><script>
const T=THREE, tints=['#e2ebe4','#e3e7ee','#f2e6d7','#dfe7e3','#e8e2ed'];
const weatherName={clear:'晴',drizzle:'小雨',rain:'大雨',storm:'雷雨',snow:'雪',fog:'雾'};
rate.textContent='整档默认概率 '+(V3.cabinTide.defaultUltraChance*100)+'%';
V3.washupCatalog.collectibles.filter(k=>k.rarity==='ultra').forEach((item,i)=>{
  const el=document.createElement('article');el.style.setProperty('--t',tints[i]);el.innerHTML=`<div class="stage"><span class="number">NO. 0${i+1}</span><canvas tabindex="0" aria-label="${item.name}，拖动或按方向键旋转，双击复位" title="拖动旋转 · 双击复位"></canvas></div><section><h2>${item.name}</h2><small>${item.weather.map(w=>weatherName[w]).join('、')||'不限天气'} · ${V3.inventoryRules.PRICE[item.rarity]} 贝币</small><p>${item.desc}</p></section>`;grid.append(el);
  const cv=el.querySelector('canvas'),r=new T.WebGLRenderer({canvas:cv,antialias:true,alpha:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputColorSpace=T.SRGBColorSpace;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.08;
  const s=new T.Scene(), model=V3.washupCatalog.build(item.id,{tag:false}),b=new T.Box3().setFromObject(model),center=b.getCenter(new T.Vector3()),size=b.getSize(new T.Vector3()),cam=new T.OrthographicCamera(-1,1,1,-1,.1,20);s.add(model);
  s.add(new T.HemisphereLight(0xfffbec,0xb2bdce,1.35));
  for(const [col,k,x,y,z] of [[0xfff3db,2.7,-3,5,4],[0xcce9ff,1.35,2,2,-3],[0xffffff,.58,3,1,3]]){const l=new T.DirectionalLight(col,k);l.position.set(x,y,z);s.add(l);}
  const defaultAz=[.12,.38,.1,.33,.22][i], defaultEl=[.19,.26,1.07,.46,.42][i];let az=defaultAz, elev=defaultEl;
  function draw(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;r.setSize(w,h,false);const a=w/h,half=Math.max(size.x,size.y,size.z)*.65;cam.left=-half/Math.min(1,1/a);cam.right=-cam.left;cam.top=half/Math.min(1,a);cam.bottom=-cam.top;cam.position.set(center.x+4*Math.cos(elev)*Math.sin(az),center.y+4*Math.sin(elev),center.z+4*Math.cos(elev)*Math.cos(az));cam.lookAt(center);cam.updateProjectionMatrix();r.render(s,cam);}
  let pointer=null,last;cv.onpointerdown=e=>{pointer=e.pointerId;last=[e.clientX,e.clientY];cv.setPointerCapture(pointer)};cv.onpointermove=e=>{if(pointer!==e.pointerId)return;az-=(e.clientX-last[0])*.012;elev=T.MathUtils.clamp(elev+(e.clientY-last[1])*.012,-1.54,1.54);last=[e.clientX,e.clientY];draw()};cv.onlostpointercapture=()=>pointer=null;cv.ondblclick=()=>{az=defaultAz;elev=defaultEl;draw()};cv.onkeydown=e=>{const d={ArrowLeft:[-.14,0],ArrowRight:[.14,0],ArrowUp:[0,.14],ArrowDown:[0,-.14]}[e.key];if(d){e.preventDefault();az+=d[0];elev=T.MathUtils.clamp(elev+d[1],-1.54,1.54);draw()}};
  new ResizeObserver(draw).observe(cv);draw();
});
</script></html>
